apiVersion: v2
name: managed-services
description: A Helm chart for managed services (PostgreSQL, Redis/Valkey, MinIO, OpenSearch)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # Using Valkey as the open-source successor to Redis
  - name: valkey
    version: 0.9.3
    repository: https://valkey-io.github.io/valkey-helm/
    condition: valkey.enabled

  # Official MinIO chart
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled

  - name: opensearch
    version: 2.23.0
    repository: https://opensearch-project.github.io/helm-charts/
    condition: opensearch.enabled

  - name: opensearch-dashboards
    version: 2.22.0
    repository: https://opensearch-project.github.io/helm-charts/
    condition: opensearch-dashboards.enabled
