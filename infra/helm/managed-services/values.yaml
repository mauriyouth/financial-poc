# Global settings
global:
  storageClass: "standard"

# --- Postgres (Custom Transparent Template) ---
postgresql:
  enabled: true
  image: "postgres:17-alpine"
  auth:
    postgresPassword: "password"
    username: "user"
    password: "password"
    database: "ufdip"
  persistence:
    size: 8Gi
  service:
    type: NodePort
    nodePort: 30432

# --- Valkey (Open Source Redis Successor) ---
# Official Valkey chart defaults
valkey:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  persistence:
    enabled: false
  service:
    type: NodePort
    nodePort: 30379

# --- MinIO (Official) ---
# Official Minio chart: https://github.com/minio/minio/tree/master/helm/minio
minio:
  enabled: true
  rootUser: "minioadmin"
  rootPassword: "minioadmin"
  defaultBuckets: "financial-poc"
  persistence:
    enabled: true
    size: 10Gi
  mode: standalone
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi

# --- OpenSearch ---
opensearch:
  enabled: true
  clusterName: "opensearch-cluster"
  singleNode: true
  majorVersion: "2"
  persistence:
    enabled: true
    size: 8Gi
  config:
    opensearch.yml:
      plugins.security.disabled: true
      discovery.type: single-node

# --- OpenSearch Dashboards ---
opensearch-dashboards:
  enabled: true
  opensearchHosts: "http://opensearch-cluster-master:9200"
# --- Ingress ---
ingress:
  enabled: true
