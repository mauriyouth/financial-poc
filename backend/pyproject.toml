[project]
name = "financial-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core shared dependencies
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0.45",
    "sqlmodel>=0.0.31",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.18.1",
]

[dependency-groups]
api = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    "anthropic>=0.75.0",
    "pydantic-ai>=1.41.0",
    "google-adk>=1.14.1",
    "minio>=7.2.20",
    "redis>=5.2.1",
    "opensearch-py>=3.1.0",
    "orjson>=3.11.7",
]

worker = [
    "rq>=2.2.0",
    "redis>=5.2.1",
    "minio>=7.2.20",
    "opensearch-py>=3.1.0",
    "pypdf>=6.6.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.26.7",
    "pillow>=11.2.0",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "docling>=2.68.0",
]

dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.13",
    "pre-commit>=4.5.1",
    "reportlab>=4.4.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "TCH",  # flake8-type-checking
    "ANN",  # flake8-annotations (type hints)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults (FastAPI Depends)
    "ANN204",  # missing type annotation for __init__
    "ANN401",  # dynamically typed expressions (Any) are disallowed
    "RUF009",  # do not perform function call in dataclass defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["ANN"]  # don't require type hints in tests

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


